<svg xmlns="http://www.w3.org/2000/svg" width="900" height="105" viewBox="0 0 900 105" role="img" aria-labelledby="title desc">
  <title id="title">Santiago Cabana</title>
  <desc id="desc">Nombre ensamblado en fragmentos sobre una cuadrícula transparente animada.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#64748b" stroke-opacity=".48" /></pattern>
    <linearGradient id="fade"><stop stop-color="black"/><stop offset=".18" stop-color="white"/><stop offset=".82" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <mask id="edges"><rect width="900" height="105" fill="url(#fade)"/></mask>
    <text id="name" x="450" y="71" text-anchor="middle" font-family="monospace" font-size="48" font-weight="700">Santiago Cabana</text>
    <clipPath id="a"><path d="M0 25H900V38H0Z M0 64H900V77H0Z"/></clipPath>
    <clipPath id="b"><path d="M0 38H900V51H0Z"/></clipPath>
    <clipPath id="c"><path d="M0 51H900V64H0Z"/></clipPath>
  </defs>
  <style>
    .grid { animation: drift 12s linear infinite; }
    .name { fill: #3347a8; }
    .a { animation: assemble-a 7s steps(8,end) infinite; }
    .b { animation: assemble-b 7s steps(8,end) infinite; }
    .c { animation: assemble-c 7s steps(8,end) infinite; }
    @keyframes drift { to { transform: translate(24px,24px); } }
    @keyframes assemble-a { 0%,100% { transform: translate(-18px,-6px); opacity: .15; } 18%,82% { transform: translate(0,0); opacity: 1; } }
    @keyframes assemble-b { 0%,100% { transform: translate(24px,8px); opacity: .15; } 24%,86% { transform: translate(0,0); opacity: 1; } }
    @keyframes assemble-c { 0%,100% { transform: translate(-12px,10px); opacity: .15; } 30%,80% { transform: translate(0,0); opacity: 1; } }
    @media (prefers-color-scheme: dark) { .name { fill: #a5b4fc; } }
    @media (prefers-reduced-motion: reduce) { .grid,.a,.b,.c { animation: none; } }
  </style>
  <g mask="url(#edges)"><rect class="grid" x="-24" y="-24" width="948" height="153" fill="url(#grid)"/></g>
  <g class="name">
    <g class="a"><use href="#name" clip-path="url(#a)"/></g>
    <g class="b"><use href="#name" clip-path="url(#b)"/></g>
    <g class="c"><use href="#name" clip-path="url(#c)"/></g>
  </g>
</svg>
